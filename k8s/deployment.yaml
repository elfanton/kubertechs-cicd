apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubertechs-cicd
  namespace: kubertechs-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubertechs-cicd
  template:
    metadata:
      labels:
        app: kubertechs-cicd
    spec:
      containers:
        - name: kubertechs-cicd
          image: ghcr.io/elfanton/kubertechs-cicd:latest
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: kubertechs-cicd
  namespace: kubertechs-dev
spec:
  type: NodePort
  selector:
    app: kubertechs-cicd
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
